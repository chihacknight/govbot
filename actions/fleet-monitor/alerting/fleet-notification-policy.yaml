# The stack's ENTIRE notification policy tree, generated by alerting.py.
#
# A real Grafana `policies:` document, on purpose: the stack is dedicated to the
# fleet monitor, so the fleet's contact point is the root receiver and every
# alert the stack produces lands in Slack and email — including a stray one,
# which should arrive as a visible surprise rather than vanish down a default
# receiver nobody reads. Applying this replaces the whole tree, which is why
# `main.py provision-alerts` first checks the tree it is replacing is its own
# (or a fresh stack's untouched default) and hard-stops on anything else.
apiVersion: 1
policies:
- orgId: 1
  receiver: fleet-monitor
  group_by:
  - alertname
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 24h
