# The fleet's three launch alert rules, generated by alerting.py — edit that, not
# this, and regenerate with `main.py alerts --out-dir alerting`.
#
# $GRAFANA_METRICS_DATASOURCE_UID is resolved at provision time: a datasource uid
# belongs to one stack, and this file has to apply to any of them. Leave it as a
# placeholder. `{{ $labels.* }}` is Grafana's own templating and stays literal.
#
# Both jurisdiction rules filter paused="false": an out-of-session state whose
# scrape fails is the legislative calendar, not a fault, and it never pages.
apiVersion: 1
groups:
- orgId: 1
  folder: Fleet Monitor
  name: fleet-monitor
  interval: 5m
  rules:
  - uid: fleet-run-failed
    title: Fleet run failed
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: $GRAFANA_METRICS_DATASOURCE_UID
      model:
        editorMode: code
        expr: last_over_time(fleet_workflow_run_status{paused="false"}[6h])
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        type: reduce
        reducer: last
        expression: A
        refId: B
        settings:
          mode: dropNN
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
        expression: B
        refId: C
    labels:
      service: fleet-monitor
    annotations:
      summary: '{{ $labels.state }}: {{ $labels.workflow }} failed'
      description: The latest completed run of this workflow did not succeed, and the jurisdiction is
        in session. Open the run's log from the dashboard's log panel to see why.
      dashboard: $GRAFANA_DASHBOARD_URL/d/fleet-monitor-overview?var-state={{ $labels.state }}&from=now-24h&to=now
    for: 10m
    noDataState: OK
    execErrState: Error
    isPaused: false
  - uid: fleet-data-stale
    title: Fleet data stale
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: $GRAFANA_METRICS_DATASOURCE_UID
      model:
        editorMode: code
        expr: last_over_time(fleet_repo_data_commit_age_hours{paused="false"}[6h])
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        type: reduce
        reducer: last
        expression: A
        refId: B
        settings:
          mode: dropNN
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 48
        expression: B
        refId: C
    labels:
      service: fleet-monitor
    annotations:
      summary: '{{ $labels.state }}: no data commit in over 48h'
      description: Nothing has landed in this repo's data path for 48h, which is two missed daily cycles
        rather than one. The scrape may be succeeding and producing nothing — check the run log, not just
        the run status.
      dashboard: $GRAFANA_DASHBOARD_URL/d/fleet-monitor-overview?var-state={{ $labels.state }}&from=now-24h&to=now
    for: 10m
    noDataState: OK
    execErrState: Error
    isPaused: false
  - uid: fleet-collector-dead
    title: Fleet collector heartbeat absent
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: $GRAFANA_METRICS_DATASOURCE_UID
      model:
        editorMode: code
        expr: absent_over_time(fleet_collector_heartbeat_repos[6h])
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        type: reduce
        reducer: last
        expression: A
        refId: B
        settings:
          mode: dropNN
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
        expression: B
        refId: C
    labels:
      service: fleet-monitor
    annotations:
      summary: Fleet monitor has not reported in 6h
      description: The collector itself has stopped shipping, so every other rule here is now blind rather
        than quiet — a green board means nothing until this clears. Check the fleet-monitor workflow's
        recent runs.
      dashboard: $GRAFANA_DASHBOARD_URL/d/fleet-monitor-overview?from=now-24h&to=now
    for: 10m
    noDataState: OK
    execErrState: Error
    isPaused: false
