    scrape_cron: "0 4 * * *"  # Eastern
  de:
    template: openstates-scrape
    name: Delaware
    toolkit_branch: main
    scrape_timeout_minutes: "720"
    scrape_cron: "0 4 * * *"  # Eastern
    labels:
    - working
  fl:
    template: openstates-scrape
    name: Florida
    toolkit_branch: main
    scrape_timeout_minutes: "2520"
    scrape_cron: "0 4 * * *"  # Eastern
    runner: self-hosted
    # Real scrape duration runs close to (or past) GitHub-hosted runners' hard
    # 6h execution cap -- confirmed for real 2026-07-25: both the nightly
    # `schedule` trigger and a manual dispatch without use-self-hosted=true
    # ran on GitHub-hosted (runner_group_name: "GitHub Actions", not the
    # MacBookPro) and got cancelled -- one at exactly 6h00m, the classic
    # hosted-runner hard-cap signature. Applied via apply.py 2026-07-25.
    force_self_hosted: "true"
    # Temporary custom image carrying a scraper fix (single-bill failures no
    # longer crash the whole ~1,900-bill session) that hasn't merged upstream
    # yet -- see PR #5724 on openstates/openstates-scrapers and
    # tamara-notes/scraper-status/not-working.md's FL section. Revert to the
    # config default (by deleting this line) once that PR merges and
    # openstates/scrapers:latest is rebuilt with the fix.
    docker_image: "ghcr.io/tamara-builds/openstates-scrapers:fl-fix-test"
    labels:
    - working
