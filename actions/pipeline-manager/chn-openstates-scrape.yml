# `session` (optional, per-locale): identifier for the legislative session this
# locale's repo currently holds, e.g. `session: "2025-2026"` or `session: "2026-ss1"`
# for a special session. Set/updated by close_session.py when rotating a repo to
# the archive org — see actions/pipeline-manager/close_session.py. Not backfilled
# for existing locales; filled in as each one goes through its first session close.
template_markers:
  open: ✏️{
  close: '}✏️'
org:
  username: govbot-openstates-scrapers
templates:
  openstates-scrape:
    folder-name: ✏️{ locale.key }✏️-legislation
    fully_override_dirs:
    - .github
  openstates-scrape-paused:
    folder-name: ✏️{ locale.key }✏️-legislation
    fully_override_dirs:
    - .github
locales:
  al:
    template: openstates-scrape
    name: Alabama
    toolkit_branch: main
    scrape_timeout_minutes: "720"
    scrape_cron: "0 5 * * *"  # Central
  ak:
    template: openstates-scrape
    name: Alaska
    toolkit_branch: main
    scrape_timeout_minutes: "720"
    scrape_cron: "0 8 * * *"  # Alaska
    runner: self-hosted
  az:
    template: openstates-scrape
    name: Arizona
    toolkit_branch: main
    scrape_timeout_minutes: "720"
    scrape_cron: "0 6 * * *"  # Mountain
    runner: self-hosted
