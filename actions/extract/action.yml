name: "Text Extraction Action"
description: "Extracts text from PDFs and XMLs in processed bill data"

inputs:
  state:
    description: "State to process (2-letter abbreviation)"
    required: true
  github-token:
    description: "GitHub token for authentication"
    required: true
  force-update:
    description: "Force push changes even if there are upstream changes"
    required: false
    default: "false"
  slack-webhook-url:
    description: >-
      Slack Incoming Webhook URL to notify when a run has errors. Optional --
      leave unset/empty to skip Slack notification entirely (e.g. before the
      webhook has been provisioned).
    required: false
    default: ""

outputs:
  extracted-now:
    description: "Bills successfully extracted this run"
    value: ${{ steps.extract.outputs.extracted-now }}
  total-bills:
    description: "Total bills found"
    value: ${{ steps.extract.outputs.total-bills }}
  already-processed:
    description: "Bills skipped because already extracted"
    value: ${{ steps.extract.outputs.already-processed }}
  unavailable:
    description: "Bills durably marked unavailable (dead link / no text layer / placeholder)"
    value: ${{ steps.extract.outputs.unavailable }}
  errors:
    description: "Genuine errors (not content-shaped failures)"
    value: ${{ steps.extract.outputs.errors }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.9"

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        PIPENV_VENV_IN_PROJECT: "1"
      run: |
        python -m pip install --upgrade pip
        pip install pipenv
        # Ensure we're in the action directory where Pipfile is located
        ACTION_DIR="${{ github.action_path }}"
        cd "$ACTION_DIR"
        echo "Current directory: $(pwd)"
        echo "Looking for Pipfile at: $ACTION_DIR/Pipfile"
        if [ ! -f "$ACTION_DIR/Pipfile" ]; then
          echo "::error::❌ Pipfile not found at $ACTION_DIR/Pipfile"
          ls -la "$ACTION_DIR" || true
          exit 1
        fi
        echo "✅ Found Pipfile, installing dependencies..."
        # Explicitly tell pipenv where the Pipfile is
        export PIPENV_PIPFILE="$ACTION_DIR/Pipfile"
        # Remove any existing virtualenv to ensure we use the correct Python version
        pipenv --rm 2>/dev/null || true
        # Verify Python version before creating venv
        python --version
        pipenv install --deploy --python "$(which python)"

    - name: Extract Text from PDFs and XMLs
      id: extract
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      env:
        PIPENV_VENV_IN_PROJECT: "1"
      run: |
        echo "📄 Extracting text from PDFs and XMLs for ${{ inputs.state }}"

        # Check if the data directory exists in the calling repo (v2.0 structure)
        if [ ! -d "${{ github.workspace }}/country:us" ]; then
          echo "❌ Data directory not found: ${{ github.workspace }}/country:us"
          echo "Make sure the data pipeline has been run first"
          exit 1
        fi

        # Configure git for periodic commits
        cd "${{ github.workspace }}"
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # Large incremental pushes (many new PDFs/extracted text files per commit)
        # can hit "fatal: the remote end hung up unexpectedly" with git's default
        # 1MiB http.postBuffer, especially over HTTP/2. Seen repeatedly in practice
        # on ma-legislation: periodic auto-commit pushes failing 3/3 retries and
        # killing the job, discarding that run's extraction work on the next
        # checkout's hard reset. Same fix that resolved it manually 2026-08-07.
        git config --local http.postBuffer 524288000
        git config --local http.version HTTP/1.1

        # Pull latest changes to ensure we have the most recent metadata with timestamps
        # This prevents race conditions where a previous run just committed updates
        echo "📥 Pulling latest changes to get updated metadata..."
        git pull origin main || {
          echo "⚠️ Pull failed, continuing with current checkout"
        }

        # Create a flag file to control the auto-commit loop
        touch /tmp/text_extraction_running

        # Start background process for periodic commits (every 30 minutes)
        (
          while [ -f /tmp/text_extraction_running ]; do
            sleep 1800  # 30 minutes

            if [ -f /tmp/text_extraction_running ]; then
              cd "${{ github.workspace }}"

              # Check if there are changes in country:us/ or .windycivi/
              if ! git diff --quiet country:us/ .windycivi/ 2>/dev/null || ! git diff --staged --quiet country:us/ .windycivi/ 2>/dev/null; then
                echo "⏰ [$(date)] Auto-committing progress to prevent data loss..."

                # Try to add files - if this fails, kill the main process
                if ! git add country:us/ .windycivi/ 2>&1; then
                  echo "::error::❌ CRITICAL: Failed to git add files during auto-commit!"
                  echo "::error::This means progress cannot be saved. Terminating job."
                  # Kill the main text extraction process
                  pkill -P $$ python || true
                  exit 1
                fi

                if ! git diff --staged --quiet; then
                  # Commit first (before pulling) to avoid "uncommitted changes" errors
                  git commit -m "🔄 Auto-save text extraction progress for ${{ inputs.state }} - $(date -u +%Y-%m-%dT%H:%M:%SZ)"

                  # Now pull and handle conflicts with merge strategy (not rebase)
                  # Rebase doesn't work well with concurrent auto-commits from multiple jobs
                  if ! git pull --no-rebase origin main 2>&1; then
                    echo "⚠️ Merge conflict detected, resolving intelligently..."

                    # Find all conflicted metadata.json files
                    CONFLICTED_FILES=$(git diff --name-only --diff-filter=U | grep metadata.json || true)

                    # For each conflicted metadata.json: preserve our _processing object
                    for file in $CONFLICTED_FILES; do
                      echo "  Resolving conflict in: $file"

                      # Extract our entire _processing object
                      OUR_PROCESSING=$(git show :2:"$file" | jq -c '.metadata._processing // empty' 2>/dev/null || echo "")

                      # Take scraper's version (has all the bill data updates)
                      git checkout --theirs "$file" || {
                        echo "::error::❌ Failed to checkout scraper's version of $file"
                        pkill -P $$ python || true
                        exit 1
                      }

                      # Re-inject our _processing object if it exists
                      if [ -n "$OUR_PROCESSING" ] && [ "$OUR_PROCESSING" != "null" ] && [ "$OUR_PROCESSING" != "empty" ]; then
                        # Merge in only our text_extraction_latest_update key, on top of
                        # theirs' _processing object -- NOT a wholesale overwrite. Theirs
                        # may have a freshly-bumped logs_latest_update (scraper added a new
                        # bill version concurrently); overwriting the whole object with our
                        # stale copy would silently defeat the skip-check that's supposed to
                        # catch "bill changed, needs re-extraction."
                        jq --argjson proc "$OUR_PROCESSING" '
                          .metadata._processing = ((.metadata._processing // {}) +
                            (if ($proc.text_extraction_latest_update // null) != null
                             then {text_extraction_latest_update: $proc.text_extraction_latest_update}
                             else {} end))
                        ' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
                        echo "  ✓ Preserved extraction metadata in $file"
                      fi
                    done

                    # Keep our files/ directories (extracted text content - always ours)
                    git checkout --ours "**/files/" 2>/dev/null || true

                    # Keep our .windycivi/ metadata
                    git checkout --ours .windycivi/ 2>/dev/null || true

                    git add -A
                    git commit --no-edit -m "🔄 Auto-merge: kept scraper data + extraction metadata + files"
                    echo "✅ Conflicts resolved intelligently"
                  fi

                  # Push with retries - if all fail, kill the job
                  PUSH_SUCCESS=false
                  for i in 1 2 3; do
                    if git push origin main 2>&1; then
                      echo "✅ Progress saved (attempt $i)"
                      PUSH_SUCCESS=true
                      break
                    else
                      echo "⚠️ Push failed (attempt $i), pulling and retrying..."
                      # Use merge strategy for concurrent updates
                      if ! git pull --no-rebase origin main 2>&1; then
                        # Resolve any conflicts intelligently
                        CONFLICTED_FILES=$(git diff --name-only --diff-filter=U | grep metadata.json || true)
                        for file in $CONFLICTED_FILES; do
                          OUR_PROCESSING=$(git show :2:"$file" | jq -c '.metadata._processing // empty' 2>/dev/null || echo "")
                          git checkout --theirs "$file" 2>/dev/null || true
                          if [ -n "$OUR_PROCESSING" ] && [ "$OUR_PROCESSING" != "null" ] && [ "$OUR_PROCESSING" != "empty" ]; then
                            # See the comment on the equivalent block above: merge in only
                            # our text_extraction_latest_update key, don't overwrite the
                            # whole _processing object and clobber theirs' logs_latest_update.
                            jq --argjson proc "$OUR_PROCESSING" '
                              .metadata._processing = ((.metadata._processing // {}) +
                                (if ($proc.text_extraction_latest_update // null) != null
                                 then {text_extraction_latest_update: $proc.text_extraction_latest_update}
                                 else {} end))
                            ' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
                          fi
                        done
                        git checkout --ours "**/files/" .windycivi/ 2>/dev/null || true
                        git add -A 2>/dev/null || true
                        git commit --no-edit -m "🔄 Auto-merge: kept scraper data + extraction metadata + files" 2>/dev/null || true
                      fi
                      sleep 5
                    fi
                  done

                  if [ "$PUSH_SUCCESS" = "false" ]; then
                    echo "::error::❌ CRITICAL: Failed to push after 3 attempts during auto-commit!"
                    echo "::error::Cannot save progress. Terminating job to prevent data loss."
                    pkill -P $$ python || true
                    exit 1
                  fi
                fi
              fi
            fi
          done
        ) &

        AUTO_COMMIT_PID=$!
        echo "🔄 Auto-commit process started (PID: $AUTO_COMMIT_PID)"

        # Change to action directory where main.py and Pipfile are colocated
        ACTION_DIR="${{ github.action_path }}"
        cd "$ACTION_DIR"
        echo "Running from: $(pwd)"

        # Verify main.py exists in action directory
        if [ ! -f "$ACTION_DIR/main.py" ]; then
          echo "::error::❌ main.py not found at $ACTION_DIR/main.py"
          ls -la "$ACTION_DIR" || true
          exit 1
        fi

        # Verify Pipfile exists in action directory
        if [ ! -f "$ACTION_DIR/Pipfile" ]; then
          echo "::error::❌ Pipfile not found at $ACTION_DIR/Pipfile"
          ls -la "$ACTION_DIR" || true
          exit 1
        fi

        # Run text extraction using the colocated main.py
        # Explicitly set Pipfile location for pipenv
        export PIPENV_PIPFILE="$ACTION_DIR/Pipfile"
        # Stream output live via tee instead of buffering it all into a shell
        # variable -- a run across thousands of bills would otherwise show
        # zero progress in the log until the entire thing finished (or hung),
        # making a slow-but-working run indistinguishable from a stuck one.
        export PYTHONUNBUFFERED=1
        EXTRACTION_LOG="$(mktemp)"
        set +e
        (cd "$ACTION_DIR" && pipenv run python main.py \
          --state "${{ inputs.state }}" \
          --data-folder "${{ github.workspace }}" \
          --incremental 2>&1) | tee "$EXTRACTION_LOG"
        EXIT_CODE=${PIPESTATUS[0]}
        set -e
        EXTRACTION_OUTPUT=$(cat "$EXTRACTION_LOG")
        rm -f "$EXTRACTION_LOG"

        # Stop the auto-commit background process
        echo "🛑 Stopping auto-commit background process..."
        rm -f /tmp/text_extraction_running
        # Kill the background process if it's still running (don't wait for it)
        kill $AUTO_COMMIT_PID 2>/dev/null || true
        # Give it a moment to exit gracefully, then force kill if needed
        sleep 1
        kill -9 $AUTO_COMMIT_PID 2>/dev/null || true
        echo "✅ Auto-commit process stopped"

        # Extract summary statistics for GitHub Actions summary (take last match only)
        TOTAL_BILLS=$(echo "$EXTRACTION_OUTPUT" | grep -oP 'Total bills: \K\d+' | tail -1 || echo "0")
        SUCCESSFUL=$(echo "$EXTRACTION_OUTPUT" | grep -oP 'Successful: \K\d+' | tail -1 || echo "0")
        ERRORS=$(echo "$EXTRACTION_OUTPUT" | grep -oP 'Errors: \K\d+' | tail -1 || echo "0")
        UNAVAILABLE=$(echo "$EXTRACTION_OUTPUT" | grep -oP 'Unavailable: \K\d+' | tail -1 || echo "0")
        SKIPPED=$(echo "$EXTRACTION_OUTPUT" | grep -oP 'Skipped \(already processed\): \K\d+' | tail -1 || echo "0")
        # Bill IDs that failed, printed by main.py under a "Failed bills:" header --
        # not written anywhere in the repo (see actions/extract/utils/common.py),
        # so the run summary is the only place these are visible.
        FAILED_BILLS=$(echo "$EXTRACTION_OUTPUT" | sed -n '/^Failed bills:$/,$p' | tail -n +2)

        # Pass stats to the caller workflow via step outputs, not a file --
        # a file sitting in the working directory can get silently clobbered
        # by the Commit Changes step's own git pull/merge (confirmed live
        # 2026-08-08: this exact file was accidentally tracked in git from
        # some past commit, so a pull would overwrite our fresh numbers with
        # a stale committed copy right before the caller workflow displayed
        # them). Outputs are just process memory -> $GITHUB_OUTPUT, no git
        # involved, nothing to clobber.
        echo "extracted-now=$SUCCESSFUL" >> "$GITHUB_OUTPUT"
        echo "total-bills=$TOTAL_BILLS" >> "$GITHUB_OUTPUT"
        echo "already-processed=$SKIPPED" >> "$GITHUB_OUTPUT"
        echo "unavailable=$UNAVAILABLE" >> "$GITHUB_OUTPUT"
        echo "errors=$ERRORS" >> "$GITHUB_OUTPUT"

        # Create GitHub Actions summary
        {
          echo "## 📊 Text Extraction Summary for ${{ inputs.state }}"
          echo ""
          echo "| Metric | Count |"
          echo "|--------|-------|"
          echo "| **Extracted now** | **$SUCCESSFUL** |"
          echo "| Total Bills | $TOTAL_BILLS |"
          echo "| Already processed | $SKIPPED |"
          echo "| Unavailable | $UNAVAILABLE |"
          echo "| Errors | $ERRORS |"
          echo ""
        } >> $GITHUB_STEP_SUMMARY

        if [ -n "$FAILED_BILLS" ]; then
          {
            echo "<details><summary>Failed bills ($ERRORS)</summary>"
            echo ""
            echo '```'
            echo "$FAILED_BILLS"
            echo '```'
            echo "</details>"
            echo ""
          } >> $GITHUB_STEP_SUMMARY
        fi

        # Notify Slack on errors, if a webhook has been configured. Silently
        # does nothing if slack-webhook-url is empty (e.g. not provisioned
        # yet) -- never blocks or fails the run either way.
        if [ -n "${{ inputs.slack-webhook-url }}" ] && [ "$ERRORS" -gt 0 ]; then
          SLACK_FAILED_BILLS=$(echo "$FAILED_BILLS" | head -20)
          SLACK_TEXT=$(printf '⚠️ *Text extraction errors for %s*: %s error(s) out of %s bills.\n```\n%s\n```\n<%s/%s/actions/runs/%s|View run>' \
            "${{ inputs.state }}" "$ERRORS" "$TOTAL_BILLS" "$SLACK_FAILED_BILLS" \
            "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
          SLACK_PAYLOAD=$(jq -n --arg text "$SLACK_TEXT" '{text: $text}')
          curl -s -X POST -H 'Content-Type: application/json' -d "$SLACK_PAYLOAD" \
            "${{ inputs.slack-webhook-url }}" > /dev/null \
            || echo "⚠️ Slack notification failed (non-fatal, continuing)"
        fi

        if [ $EXIT_CODE -eq 0 ]; then
          echo "✅ **Status:** Complete" >> $GITHUB_STEP_SUMMARY
          echo "✅ Text extraction complete"
        else
          echo "⚠️ **Status:** Ended with exit code $EXIT_CODE" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ Text extraction ended with code $EXIT_CODE (progress has been auto-saved)"
          exit $EXIT_CODE
        fi

    - name: Commit Changes
      # Without this, a nonzero exit from the extraction step above (which
      # happens on every run that hits even one permanently-failing bill --
      # e.g. a dead PDF link or an unparseable scanned document -- see
      # tamara-notes/scraper-status/not-working.md) skips this step entirely,
      # silently discarding any progress that didn't make it into a periodic
      # 30-min auto-save. Confirmed happening live 2026-08-08 on ma-legislation:
      # a 14-minute run's entire output was lost this way, only caught and
      # recovered by hand because someone was actively watching.
      if: always()
      shell: bash
      run: |
        echo "📝 Committing extracted text files"

        # Configure git
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # Large incremental pushes (many new PDFs/extracted text files per commit)
        # can hit "fatal: the remote end hung up unexpectedly" with git's default
        # 1MiB http.postBuffer, especially over HTTP/2. Seen repeatedly in practice
        # on ma-legislation: periodic auto-commit pushes failing 3/3 retries and
        # killing the job, discarding that run's extraction work on the next
        # checkout's hard reset. Same fix that resolved it manually 2026-08-07.
        git config --local http.postBuffer 524288000
        git config --local http.version HTTP/1.1

        # Add changes (bill text files in country:us/)
        git add country:us/ .windycivi/
        # Conditional: only exists if extraction reached its final summary
        # step (main.py can exit early via an unhandled exception before
        # ever writing it) -- a plain `git add` on a missing path would fail
        # the whole command and abort this step.
        [ -f .extraction_unavailable.json ] && git add .extraction_unavailable.json

        # Commit if there are changes
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          # Commit first (before pulling) to avoid "uncommitted changes" errors
          git commit -m "Extract text from PDFs/XMLs for ${{ inputs.state }} - $(date)"

          # Now pull and handle conflicts with merge strategy
          echo "📥 Pulling latest changes..."
          if ! git pull --no-rebase origin main 2>&1; then
            echo "⚠️ Merge conflict detected, resolving intelligently..."

            # Find all conflicted metadata.json files
            CONFLICTED_FILES=$(git diff --name-only --diff-filter=U | grep metadata.json || true)

            # For each conflicted metadata.json: preserve our _processing object
            for file in $CONFLICTED_FILES; do
              echo "  Resolving conflict in: $file"

              # Extract our entire _processing object
              OUR_PROCESSING=$(git show :2:"$file" | jq -c '.metadata._processing // empty' 2>/dev/null || echo "")

              # Take scraper's version (has all the bill data updates)
              git checkout --theirs "$file"

              # Re-inject our _processing object if it exists
              if [ -n "$OUR_PROCESSING" ] && [ "$OUR_PROCESSING" != "null" ] && [ "$OUR_PROCESSING" != "empty" ]; then
                # See the comment on the equivalent block in the periodic auto-commit
                # loop above: merge in only our text_extraction_latest_update key, don't
                # overwrite the whole _processing object and clobber theirs' logs_latest_update.
                jq --argjson proc "$OUR_PROCESSING" '
                  .metadata._processing = ((.metadata._processing // {}) +
                    (if ($proc.text_extraction_latest_update // null) != null
                     then {text_extraction_latest_update: $proc.text_extraction_latest_update}
                     else {} end))
                ' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
                echo "  ✓ Preserved extraction metadata in $file"
              fi
            done

            # Keep our files/ directories (extracted text content - always ours)
            git checkout --ours "**/files/" 2>/dev/null || true

            # Keep our .windycivi/ metadata
            git checkout --ours .windycivi/ 2>/dev/null || true

            git add -A
            git commit --no-edit -m "🔄 Auto-merge: kept scraper data + extraction metadata + files"
            echo "✅ Conflicts resolved intelligently"
          fi

          # Retry push up to 3 times in case of concurrent updates
          for i in 1 2 3; do
            if [ "${{ inputs.force-update }}" = "true" ]; then
              if git push --force-with-lease origin main; then
                echo "✅ Changes pushed successfully (attempt $i)"
                break
              fi
            else
              if git push origin main; then
                echo "✅ Changes pushed successfully (attempt $i)"
                break
              fi
            fi

            if [ $i -lt 3 ]; then
              echo "⚠️ Push failed (attempt $i), pulling and retrying..."
              # Use merge strategy for concurrent updates
              if ! git pull --no-rebase origin main 2>&1; then
                # Resolve conflicts intelligently
                CONFLICTED_FILES=$(git diff --name-only --diff-filter=U | grep metadata.json || true)
                for file in $CONFLICTED_FILES; do
                  OUR_PROCESSING=$(git show :2:"$file" | jq -c '.metadata._processing // empty' 2>/dev/null || echo "")
                  git checkout --theirs "$file" 2>/dev/null || true
                  if [ -n "$OUR_PROCESSING" ] && [ "$OUR_PROCESSING" != "null" ] && [ "$OUR_PROCESSING" != "empty" ]; then
                    # See the comment on the equivalent block above: merge in only our
                    # text_extraction_latest_update key, don't clobber theirs' logs_latest_update.
                    jq --argjson proc "$OUR_PROCESSING" '
                      .metadata._processing = ((.metadata._processing // {}) +
                        (if ($proc.text_extraction_latest_update // null) != null
                         then {text_extraction_latest_update: $proc.text_extraction_latest_update}
                         else {} end))
                    ' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
                  fi
                done
                git checkout --ours "**/files/" .windycivi/ 2>/dev/null || true
                git add -A 2>/dev/null || true
                git commit --no-edit -m "🔄 Auto-merge: kept scraper data + extraction metadata + files" 2>/dev/null || true
              fi
              sleep 2
            else
              echo "❌ Failed to push after 3 attempts"
              exit 1
            fi
          done

          echo "✅ Changes committed and pushed"
        fi
