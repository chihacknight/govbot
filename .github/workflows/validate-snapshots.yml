name: Validate Snapshots

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      report-publisher: ${{ steps.changes.outputs.report-publisher }}
      pipeline-manager: ${{ steps.changes.outputs.pipeline-manager }}
      govbot: ${{ steps.changes.outputs.govbot }}
      format: ${{ steps.changes.outputs.format }}
      fleet-monitor: ${{ steps.changes.outputs.fleet-monitor }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changes
        run: |
          # Configuration: job name and corresponding directory to watch
          MODULES=(
            "report-publisher:actions/report-publisher"
            "pipeline-manager:actions/pipeline-manager"
            "govbot:actions/govbot"
            "format:actions/format"
            # fleet-monitor also watches pipeline-manager: its render-snapshots.sh
            # smoke-tests the real pipeline-manager config, so config changes there
            # must run the fleet-monitor job too.
            "fleet-monitor:actions/fleet-monitor actions/pipeline-manager .github/workflows/fleet-logs.yml .github/workflows/fleet-metrics.yml"
          )

          # Always run all tests on main branch or workflow_dispatch
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            for module in "${MODULES[@]}"; do
              JOB_NAME="${module%%:*}"
              echo "${JOB_NAME}=true" >> $GITHUB_OUTPUT
            done
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.sha }}"
            CHANGED_FILES=$(git diff --name-only $BASE_SHA $HEAD_SHA || echo "")
          else
            # For push events, compare with previous commit
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD || echo "")
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # If workflow file changes, run all tests
          if echo "$CHANGED_FILES" | grep -q "\.github/workflows/validate-snapshots\.yml"; then
            for module in "${MODULES[@]}"; do
              JOB_NAME="${module%%:*}"
              echo "${JOB_NAME}=true" >> $GITHUB_OUTPUT
            done
            exit 0
          else
            # Otherwise, check each module individually. A module may watch
            # several space-separated directories; any match triggers its job.
            for module in "${MODULES[@]}"; do
              JOB_NAME="${module%%:*}"
              DIRECTORIES="${module#*:}"
              MATCHED=false
              for dir in $DIRECTORIES; do
                if grep -Fq "$dir/" <<< "$CHANGED_FILES" || grep -Fxq "$dir" <<< "$CHANGED_FILES"; then
                  MATCHED=true
                fi
              done
              echo "${JOB_NAME}=${MATCHED}" >> $GITHUB_OUTPUT
            done
          fi

  pipeline-manager-snapshots:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.pipeline-manager == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run test runner
        run: |
          cd actions/pipeline-manager
          ../../scripts/before-snapshots.sh __snapshots__
          ./render-snapshots.sh
          ../../scripts/verify-snapshots.sh __snapshots__

      - name: Test the moved_to marker and the redirect guard
        run: |
          pip install pyyaml
          cd actions/pipeline-manager
          python3 test_moved.py

  fleet-monitor-snapshots:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.fleet-monitor == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pipenv
          cd actions/fleet-monitor
          pipenv install --deploy

      - name: Run test runner
        run: |
          cd actions/fleet-monitor
          ../../scripts/before-snapshots.sh __snapshots__
          ./render-snapshots.sh
          ../../scripts/verify-snapshots.sh __snapshots__

      - name: Test Vector delivery and watermarks
        working-directory: actions/fleet-monitor
        run: pipenv run python -m unittest -v test_vector_delivery

  report-publisher-snapshots:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.report-publisher == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run test runner
        run: |
          cd actions/report-publisher
          ../../scripts/before-snapshots.sh examples/__snapshots__
          ./render-snapshots.sh
          ../../scripts/verify-snapshots.sh examples/__snapshots__

  govbot-snapshots:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.govbot == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-


      - name: Run tests
        run: |
          cd actions/govbot
          cargo test

  format-snapshots:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.format == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install jsonschema and click
        run: |
          # click: test_bill_nightly.py runs the formatter's own modules
          # (utils/process_utils.py imports it); version as in Pipfile.
          pip install jsonschema click==8.1.7

      - name: Log writer, backfill and nightly bill tests
        run: |
          cd actions/format
          python3 test_log_jsonl.py
          python3 test_backfill_logs.py
          python3 test_bill_nightly.py

      - name: Validate snapshots against schemas
        run: |
          cd actions/format
          python3 << 'EOF'
          import json
          import os
          from pathlib import Path
          from jsonschema import validate, ValidationError

          schemas_dir = Path("schemas")
          snapshots_dir = Path("snapshots")

          # Load schemas
          metadata_schema = json.load(open(schemas_dir / "metadata.schema.json"))
          action_log_schema = json.load(open(schemas_dir / "action_log.schema.json"))
          vote_event_log_schema = json.load(open(schemas_dir / "vote_event_log.schema.json"))

          errors = []

          # Validate all metadata.json files
          for metadata_file in snapshots_dir.rglob("metadata.json"):
              try:
                  data = json.load(open(metadata_file))
                  validate(instance=data, schema=metadata_schema)
                  print(f"✓ {metadata_file}")
              except ValidationError as e:
                  error_msg = str(e)
                  errors.append(f"{metadata_file}: {error_msg}")
                  print(f"✗ {metadata_file}: {error_msg}")

          # Validate every line of every bill's action/vote log
          for kind, schema in (("action_logs.jsonl", action_log_schema), ("vote_event_logs.jsonl", vote_event_log_schema)):
              for log_file in snapshots_dir.rglob(kind):
                  for n, raw in enumerate(open(log_file, encoding="utf-8"), start=1):
                      if not raw.strip():
                          continue
                      try:
                          validate(instance=json.loads(raw), schema=schema)
                      except (ValidationError, json.JSONDecodeError) as e:
                          errors.append(f"{log_file}:{n}: {e}")
                          print(f"✗ {log_file}:{n}: {e}")
                  print(f"✓ {log_file}")

          # The old one-file-per-log layout must not come back
          for stray in snapshots_dir.rglob("logs/*.json"):
              errors.append(f"{stray}: old-style log file (logs now live in action_logs.jsonl / vote_event_logs.jsonl)")

          if errors:
              print(f"\n{len(errors)} validation error(s) found:")
              for error in errors:
                  print(f"  - {error}")
              exit(1)
          else:
              print(f"\n✓ All snapshots validated successfully")
          EOF

      - name: Verify snapshots match committed versions
        run: |
          cd actions/format
          ../../scripts/verify-snapshots.sh snapshots
