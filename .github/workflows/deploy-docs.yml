name: Deploy docs & dashboard to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"
  schedule:
    # Refresh the committee-hearings feed twice daily: 08:00 UTC (morning) and
    # 20:00 UTC (afternoon, to catch same-day committee-hearing postings).
    - cron: "0 8,20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdbook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      # Live committee hearings + witness-slip windows (IL: ilga.gov, WA:
      # leg.wa.gov) — the dashboard's only data source. The scraper is fail-soft
      # (a source outage yields zero hearings, never a crash); we only replace
      # the committed sample when the fresh run actually produced hearings, so
      # a total outage keeps the last-good sample rather than blanking the panel.
      - name: Build committee hearings feed
        run: |
          set -uo pipefail
          python3 actions/scrape-hearings/main.py \
            --jurisdictions il,wa \
            --output /tmp/hearings.json \
            --rss /tmp/hearings.xml \
            || echo "::warning::hearings scrape reported errors"
          if [ -s /tmp/hearings.json ] && \
             [ "$(python3 -c 'import json,sys; print(len(json.load(open("/tmp/hearings.json"))["hearings"]))' 2>/dev/null || echo 0)" -gt 0 ]; then
            mv /tmp/hearings.json docs/src/dashboard/hearings.json
            [ -s /tmp/hearings.xml ] && mv /tmp/hearings.xml docs/src/dashboard/hearings.xml
            echo "hearings.json + hearings.xml refreshed"
          else
            echo "::warning::no hearings scraped; keeping committed sample hearings.json + hearings.xml"
          fi
          ls -lh docs/src/dashboard/hearings.json docs/src/dashboard/hearings.xml

      - name: Build docs
        run: mdbook build docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
