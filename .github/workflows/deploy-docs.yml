name: Deploy docs & dashboard to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"
  schedule:
    # Refresh twice daily: 08:00 UTC (after the 6am UTC bill scrapes) and 20:00
    # UTC (afternoon, to catch same-day committee-hearing postings). The bill
    # data.json and the live hearings.json are both rebuilt on each run.
    - cron: "0 8,20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Real deploys share one "pages" queue. PR build-checks never deploy, so they get their
# own per-PR group — otherwise a PR's check queued into "pages" replaces (cancels) a
# pending main-branch deploy, as happened to the #182 deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Scratch space lives in the runner's work disk (runner.temp), not /tmp:
    # since ubuntu-latest moved to 26.04 (Oct 24, 2026) /tmp is a small
    # in-memory filesystem that cannot hold the 56 legislation clones
    # ("could not write", "Disk quota exceeded"). runner.temp is on disk on
    # every image.
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # Fast path for frontend-only changes.
      #
      # The full data pipeline below (clone 47+ legislation repos, tag, vendor
      # photos, IL synopses, hearings, maps, elections + all enrichments) takes
      # 40+ minutes and refreshes government data. It does NOT need to run for a
      # pure dashboard HTML/CSS/JS change, nor on a PR (PRs never deploy). So:
      #
      #   * scheduled / manual runs        -> always full refresh (keep data fresh)
      #   * a push to main that touches any file that ISN'T a dashboard file
      #     (`docs/src/dashboard/**`) or a Markdown doc (`*.md`, e.g. CLAUDE.md)
      #                                    -> full refresh
      #   * a push to main touching only dashboard files and/or Markdown docs,
      #     or any PR
      #                                    -> skip the pipeline, reuse the last
      #                                       full build's data from cache
      #     (Markdown docs are pure documentation — they don't feed the data
      #      pipeline — so a docs-only change stays on the fast path; mdbook still
      #      rebuilds and publishes with the committed data.)
      #
      # Everything except data.json + the two .gitignore'd artifacts
      # (il_summaries.json, summaries/, legislator_images.json + assets/legislators/) is
      # committed with real data, so the only thing the fast path must restore is
      # those. If the cache is missing (or holds only the tiny sample data.json),
      # a push to main falls back to a full refresh so we never publish stale/
      # sample data; a PR just builds with whatever is present (no deploy).
      # ---------------------------------------------------------------------
      - name: Determine build scope
        id: scope
        run: |
          set -uo pipefail
          E="${{ github.event_name }}"
          if [ "$E" = "schedule" ] || [ "$E" = "workflow_dispatch" ]; then
            echo "event=$E -> full data refresh"; echo "refresh=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$E" = "pull_request" ]; then
            echo "pull request -> skip data pipeline (build check only, no deploy)"
            echo "refresh=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BASE="${{ github.event.before }}"; HEAD="${{ github.sha }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no base sha ($BASE) -> full refresh"; echo "refresh=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE" "$HEAD" >/dev/null 2>&1 || true
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null || ! git cat-file -e "${HEAD}^{commit}" 2>/dev/null; then
            echo "could not resolve ${BASE}..${HEAD} -> full refresh"; echo "refresh=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED="$(git diff --name-only "$BASE" "$HEAD")"
          echo "changed files:"; printf '%s\n' "$CHANGED"
          if [ -z "$CHANGED" ]; then echo "refresh=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Fast path if EVERY changed file is site-only — nothing the data pipeline reads:
          #   docs/**                 the whole mdbook site: the landing + docs pages, the
          #                           civic theme (docs/theme/**), book.toml, images, the
          #                           dashboards (docs/src/dashboard/**) and any future
          #                           sub-site under docs/src/<name>/ (github.io/govbot/<name>/)
          #   *.md                    Markdown docs anywhere (CLAUDE.md, README.md, …)
          #   llms.txt, catalog.json  root AI/catalog guides (not read by any pipeline)
          #   tamara-notes/**         design notes
          #   .github/** except this workflow (other workflows, templates)
          # The ~40-min refresh is skipped and mdbook rebuilds with the last full build's
          # data. Anything else (actions/**, scripts/**, schemas/**, this workflow, …) is a
          # data/machinery change and forces a full refresh.
          REST="$(printf '%s\n' "$CHANGED" \
            | grep -vE '^docs/' \
            | grep -vE '\.md$' \
            | grep -vE '^(llms\.txt|catalog\.json)$' \
            | grep -vE '^tamara-notes/' \
            | grep -vE '^\.github/' \
            || true)"
          if printf '%s\n' "$CHANGED" | grep -qx '.github/workflows/deploy-docs.yml'; then
            REST="$REST .github/workflows/deploy-docs.yml"
          fi
          if [ -n "$REST" ]; then
            echo "data/machinery change -> full refresh:"; printf '%s\n' "$REST"; echo "refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "site-only change -> skip data pipeline (reuse cached build data)"; echo "refresh=false" >> "$GITHUB_OUTPUT"
          fi

      # On the fast path, restore the last full build's data.json + gitignored
      # artifacts (IL synopses, state summaries, sponsor-photo manifest + images) and the
      # other pipeline-built files (roster, maps, hearings + elections data and RSS feeds),
      # so the deploy carries the same real data the scheduled build produced — the
      # committed copies of those are old samples.
      - name: Restore last full build's data
        id: builtdata
        if: steps.scope.outputs.refresh != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            docs/src/dashboard/data.json
            docs/src/dashboard/il_summaries.json
            docs/src/dashboard/summaries
            docs/src/dashboard/legislator_images.json
            docs/src/dashboard/assets/legislators
            docs/src/dashboard/people.json
            docs/src/dashboard/maps.json
            docs/src/dashboard/hearings.json
            docs/src/dashboard/hearings.xml
            docs/src/dashboard/hearings
            docs/src/dashboard/elections.json
            docs/src/dashboard/elections.xml
            docs/src/dashboard/elections
          key: govbot-built-data-${{ github.run_id }}
          restore-keys: |
            govbot-built-data-

      # Decide the effective scope. On a push to main we must never publish the
      # tiny sample data.json, so if the cache missed (or restored only the
      # sample) we fall back to a full refresh. PRs never deploy, so they build
      # with whatever is present.
      - name: Finalize build scope
        id: gate
        run: |
          set -uo pipefail
          R="${{ steps.scope.outputs.refresh }}"
          if [ "$R" != "true" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            SZ="$(wc -c < docs/src/dashboard/data.json 2>/dev/null || echo 0)"
            if [ -z "${{ steps.builtdata.outputs.cache-matched-key }}" ] || [ "$SZ" -lt 100000 ]; then
              echo "no usable cached data.json (matched='${{ steps.builtdata.outputs.cache-matched-key }}', size=$SZ) -> forcing full refresh"
              R="true"
            else
              echo "reusing cached build data (data.json=$SZ bytes); skipping the data pipeline"
            fi
          fi
          echo "effective refresh=$R"
          echo "refresh=$R" >> "$GITHUB_OUTPUT"

      - name: Install mdbook
        uses: peaceiris/actions-mdbook@v2
        with:
          # Pinned: docs/theme/index.hbs is a customized copy of mdbook 0.4.43's own
          # template, and mdbook 0.5 removed helpers it uses (e.g. `previous`), so
          # "latest" fails to render. Bump only together with a re-based index.hbs.
          mdbook-version: '0.4.43'

      # Install the govbot CLI so we can run the embedding tagger (`govbot tag`).
      - name: Install govbot CLI
        if: steps.gate.outputs.refresh == 'true'
        env:
          # The installer checks the release through the GitHub API; anonymous calls
          # from the shared runner addresses get rate-limited (a scheduled run in
          # Oct 2026 failed with "Unable to find nightly release" that way).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/chihacknight/govbot/main/actions/govbot/scripts/install-nightly.sh | bash
          echo "$HOME/.govbot/bin" >> "$GITHUB_PATH"

      # Refresh the legislator-name roster (people.json) from the public-domain
      # Open States people repo, so the dashboard can show full sponsor names for
      # jurisdictions that publish bills with surnames only (AK, WY, ...). Fully
      # fail-soft: a failed clone or empty result leaves the committed roster in
      # place (the build script refuses to write an empty file), so the deploy
      # never breaks. A shallow, blobless, sparse clone keeps this to ~1s.
      - name: Refresh legislator name roster
        if: steps.gate.outputs.refresh == 'true'
        run: |
          set -uo pipefail
          if git clone --depth 1 --filter=blob:none --sparse \
               https://github.com/openstates/people.git ${{ runner.temp }}/openstates-people \
             && git -C ${{ runner.temp }}/openstates-people sparse-checkout set data; then
            python3 scripts/build_people_roster.py \
              --people-dir ${{ runner.temp }}/openstates-people \
              --output docs/src/dashboard/people.json \
              || echo "::warning::roster build failed; keeping committed people.json"
          else
            echo "::warning::could not clone openstates/people; keeping committed people.json"
          fi
          ls -lh docs/src/dashboard/people.json || true

      # The ~90MB all-MiniLM-L6-v2 ONNX model is downloaded once and reused
      # across runs. Stable key => downloaded on the first run, restored after.
      - name: Cache embedding model
        if: steps.gate.outputs.refresh == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/govbot-model
          key: govbot-minilm-onnx-v2 # v2: the model moved from /tmp to runner.temp; a cache archive restores to the path it was saved from, so the v1 archive never lands where the build now looks

      # Per-repo incremental state: the seen-bills ledger + a snapshot of the
      # produced tag files. Keyed on the taxonomy hash so editing the topic list
      # busts the cache (forces a full re-tag); the run-id suffix + restore-keys
      # prefix means each run saves a fresh snapshot and restores the latest one.
      - name: Cache incremental tag state
        if: steps.gate.outputs.refresh == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/govbot-cache
          key: govbot-tags-${{ hashFiles('scripts/govbot-dashboard.yml') }}-${{ github.run_id }}
          restore-keys: |
            govbot-tags-${{ hashFiles('scripts/govbot-dashboard.yml') }}-

      # Fetch govbot's processed legislation dataset, tag it with the embedding
      # model, and rebuild the dashboard's data.json before mdbook runs. We clone
      # via `govbot clone` (the chn-openstates-files dataset) rather than the raw
      # openstates scraper repos, because `govbot logs`/`govbot tag` require
      # govbot's OCD-files layout (country:/state:/sessions/.../logs). Every stage
      # that touches the network or the tagger degrades to a warning + the keyword
      # fallback (scripts/dashboard_tags.json) or, ultimately, the committed sample
      # data, so the docs deploy never breaks.
      - name: Build dashboard data from legislation repos
        if: steps.gate.outputs.refresh == 'true'
        env:
          GOVBOT_DATA: ${{ runner.temp }}/govbot-data
          MODEL_DIR: ${{ runner.temp }}/govbot-model
          CACHE_DIR: ${{ runner.temp }}/govbot-cache
          DASHBOARD_CONFIG: ${{ github.workspace }}/scripts/govbot-dashboard.yml
          FILTER_SCRIPT: ${{ github.workspace }}/scripts/filter_new_bills.py
        run: |
          set -uo pipefail
          mkdir -p ${{ runner.temp }}/govbot-data ${{ runner.temp }}/govbot-model ${{ runner.temp }}/govbot-cache

          # Clone/pull the full supported dataset (depth-50 shallow, from
          # chn-openstates-files) into ${{ runner.temp }}/govbot-data/repos in govbot format.
          govbot clone all --govbot-dir ${{ runner.temp }}/govbot-data --parallel 8 \
            || echo "::warning::govbot clone reported errors; proceeding with whatever cloned"

          if [ -z "$(ls -A ${{ runner.temp }}/govbot-data/repos 2>/dev/null)" ]; then
            echo "::warning::no legislation data cloned; keeping committed sample data"
          else
            cloned="$(find ${{ runner.temp }}/govbot-data/repos -mindepth 1 -maxdepth 1 -type d | wc -l)"
            echo "cloned $cloned repos"
            # Most states missing means the runner ran out of room (or the data
            # host is down), not that those states have nothing: stop here rather
            # than publish a dashboard with half the country gone.
            if [ "$cloned" -lt 40 ]; then
              echo "::error::only $cloned of 56 legislation repos cloned; refusing to build from a partial clone"
              df -h /tmp /home/runner || true
              exit 1
            fi

            # Warm up the model in a single process BEFORE fanning out, so the
            # parallel workers below don't race to download it. Empty stdin is
            # fine: govbot tag downloads the model before reading any lines.
            mkdir -p ${{ runner.temp }}/govbot-warmup
            cp "$DASHBOARD_CONFIG" ${{ runner.temp }}/govbot-warmup/govbot.yml
            ( cd ${{ runner.temp }}/govbot-warmup && : | govbot tag --govbot-dir "$MODEL_DIR" ) \
              || echo "::warning::embedding model warm-up failed; tagging may use keyword fallback"

            # Tag each repo incrementally, 4 at a time. Repos are independent.
            find ${{ runner.temp }}/govbot-data/repos -mindepth 1 -maxdepth 1 -type d -name '*-legislation' -print0 \
              | xargs -0 -r -P4 -I{} bash scripts/tag_dashboard_repo.sh {}
            echo "tag files produced: $(find ${{ runner.temp }}/govbot-data/repos -path '*/tags/*.tag.json' | wc -l)"

            python3 scripts/build_dashboard_data.py \
              --govbot-dir ${{ runner.temp }}/govbot-data \
              --tags-config scripts/dashboard_tags.json \
              --source-label "github.com/chn-openstates-files" \
              --output docs/src/dashboard/data.json \
              || {
                echo "::warning::dashboard data build failed; keeping committed sample data"
                echo "::group::repo layout sample (for debugging)"
                find ${{ runner.temp }}/govbot-data/repos -mindepth 1 -maxdepth 5 -not -path '*/.git*' | sort | head -300 || true
                echo "::endgroup::"
              }
          fi
          ls -lh docs/src/dashboard/data.json

      # Vendor sponsor headshots for the bills the homepage shows. Public CC0
      # legislator photos (Open States ``image:`` URLs) are downloaded ONLY for
      # the sponsors of the on-screen recent bills, into an asset dir + manifest
      # that are .gitignore'd — build artifacts published with the site, never
      # committed. Reuses the ${{ runner.temp }}/openstates-people checkout from the roster
      # step. Fully fail-soft: a missing checkout or a failed image just leaves
      # those sponsors as monogram avatars; the deploy never breaks.
      - name: Vendor sponsor photos for on-screen bills
        if: steps.gate.outputs.refresh == 'true'
        run: |
          set -uo pipefail
          if [ -d ${{ runner.temp }}/openstates-people/data ]; then
            python3 scripts/fetch_sponsor_photos.py \
              --data docs/src/dashboard/data.json \
              --people-dir ${{ runner.temp }}/openstates-people \
              --out-dir docs/src/dashboard/assets/legislators \
              --manifest docs/src/dashboard/legislator_images.json \
              || echo "::warning::sponsor-photo vendor reported errors; those sponsors just aren't pictured"
          else
            echo "::warning::no openstates/people checkout; skipping sponsor photos (monogram fallback)"
          fi
          ls -lh docs/src/dashboard/legislator_images.json 2>/dev/null || true
          ls -1 docs/src/dashboard/assets/legislators/ 2>/dev/null | wc -l || true

      # Illinois bill synopses ("What this bill is about"). IL is the one state
      # whose dashboard bills read badly — the stored title is the ILGA short-code
      # ("$DFPR-TECH") and govbot carries no abstract — so we extract each bill's
      # official "SYNOPSIS AS INTRODUCED" from its full-text PDF (poppler) into
      # il_summaries.json. A bill's introduced synopsis never changes, so the file
      # is CACHED between runs and each run only summarizes a capped number of new
      # bills: the ~12.8k IL backlog backfills over successive deploys and steady
      # state costs only the day's new bills. The run-id key + restore-keys prefix
      # carries the growing cache forward. Fully fail-soft (no poppler / unreachable
      # PDF -> that bill just stays unsummarized).
      - name: Cache Illinois bill synopses
        if: steps.gate.outputs.refresh == 'true'
        uses: actions/cache@v4
        with:
          path: docs/src/dashboard/il_summaries.json
          key: il-summaries-${{ github.run_id }}
          restore-keys: |
            il-summaries-
      - name: Build Illinois bill synopses
        if: steps.gate.outputs.refresh == 'true'
        run: |
          set -uo pipefail
          sudo apt-get update && sudo apt-get install -y poppler-utils \
            || echo "::warning::poppler-utils install failed; IL synopses skipped this run"
          python3 scripts/build_il_summaries.py \
            --data docs/src/dashboard/data.json \
            --cache docs/src/dashboard/il_summaries.json \
            --out docs/src/dashboard/il_summaries.json \
            --cap 1500 \
            || echo "::warning::IL synopsis build reported errors; bills stay unsummarized"
          ls -lh docs/src/dashboard/il_summaries.json 2>/dev/null || true

      # Official bill summaries for states whose bills otherwise just repeat their
      # title under "What this bill is about": the summary document each legislature
      # publishes and Open States links in the bill's record (MI House/Senate fiscal
      # agency analyses, TN fiscal notes, ID statements of purpose, LA digests). A
      # summary is kept only when the document names that bill. Same model as the IL
      # synopses: cached between runs, capped per run (newest activity first,
      # round-robin across states) so the backlog fills over successive deploys,
      # fully fail-soft. Writes summaries/<state>.json (gitignored).
      - name: Cache official bill summaries
        if: steps.gate.outputs.refresh == 'true'
        uses: actions/cache@v4
        with:
          path: docs/src/dashboard/summaries
          key: bill-summaries-${{ github.run_id }}
          restore-keys: |
            bill-summaries-
      - name: Build official bill summaries
        if: steps.gate.outputs.refresh == 'true'
        run: |
          set -uo pipefail
          python3 scripts/build_bill_summaries.py \
            --data docs/src/dashboard/data.json \
            --out-dir docs/src/dashboard/summaries \
            --cap 2500 \
            || echo "::warning::bill summary build reported errors; bills stay unsummarized"
          ls -lh docs/src/dashboard/summaries 2>/dev/null || true

      # Live committee hearings + witness-slip windows (IL: ilga.gov, WA:
      # leg.wa.gov, MA: malegislature.gov, AK: akleg.gov). This is a rolling near-future window, separate from the
      # daily bill snapshot, so it has its own file. The scraper is fail-soft
      # (a source outage yields zero hearings, never a crash); we only replace
      # the committed sample when the fresh run actually produced hearings, so
      # a total outage keeps the last-good sample rather than blanking the panel.
      - name: Build committee hearings feed
        if: steps.gate.outputs.refresh == 'true'
        # Federal rules open for comment come from the keyless Federal Register API.
        run: |
          set -uo pipefail
          rm -rf ${{ runner.temp }}/hearings_feeds
          python3 actions/scrape-hearings/main.py \
            --jurisdictions il,wa,ma,ak,us \
            --output ${{ runner.temp }}/hearings.json \
            --rss ${{ runner.temp }}/hearings.xml \
            --rss-feeds-dir ${{ runner.temp }}/hearings_feeds \
            --dashboard-data docs/src/dashboard/data.json \
            --participation docs/src/dashboard/participation.json \
            || echo "::warning::hearings scrape reported errors"
          if [ -s ${{ runner.temp }}/hearings.json ] && \
             [ "$(python3 -c 'import json,sys; print(len(json.load(open("${{ runner.temp }}/hearings.json"))["hearings"]))' 2>/dev/null || echo 0)" -gt 0 ]; then
            mv ${{ runner.temp }}/hearings.json docs/src/dashboard/hearings.json
            [ -s ${{ runner.temp }}/hearings.xml ] && mv ${{ runner.temp }}/hearings.xml docs/src/dashboard/hearings.xml
            # Replace the whole granular-feed directory so feeds for bills/hearings that
            # dropped out of the window don't linger as stale files.
            rm -rf docs/src/dashboard/hearings
            [ -d ${{ runner.temp }}/hearings_feeds ] && mv ${{ runner.temp }}/hearings_feeds docs/src/dashboard/hearings
            echo "hearings.json + hearings.xml + granular feeds refreshed"
          else
            echo "::warning::no hearings scraped; keeping committed sample hearings.json + hearings.xml + granular feeds"
          fi
          ls -lh docs/src/dashboard/hearings.json docs/src/dashboard/hearings.xml
          ls -1 docs/src/dashboard/hearings/ 2>/dev/null | head -5 || true

      # District locator maps: Chicago ward + police-district boundaries + CPS board
      # subdistricts (City of Chicago Portal + Chalkbeat's 2026 board map) and
      # statewide IL Senate/House + U.S. House districts + the IL outline (Census
      # TIGERweb), plus the Chicago neighborhoods each district touches (community
      # areas), projected/simplified into a compact maps.json the Elections page draws
      # next to each race. Fail-soft — an outage leaves the committed maps.json in
      # place (the script only writes when it fetched a basemap).
      - name: Build district maps
        if: steps.gate.outputs.refresh == 'true'
        run: |
          set -uo pipefail
          python3 actions/scrape-maps/main.py --output docs/src/dashboard/maps.json \
            || echo "::warning::scrape-maps reported errors; keeping committed maps.json"
          ls -lh docs/src/dashboard/maps.json || true

      # Illinois & Chicago elections feed (Elections Happening in IL): candidate lists from
      # the Chicago Board of Elections and the Illinois SBE "Who Is Running" list,
      # placed onto the committed race-structure seed, plus the "Springfield"
      # rules-of-the-game feed (IL bills tagged elections/education from the
      # data.json built above, cross-referenced with hearings.json). Fully
      # fail-soft — a source outage yields zero candidates, never a crash. We
      # replace the committed sample only when the fresh run actually produced
      # something (candidates placed OR Springfield bills), so a total outage
      # keeps the last-good curated sample rather than blanking everything.
      - name: Build Illinois & Chicago elections feed
        if: steps.gate.outputs.refresh == 'true'
        run: |
          set -uo pipefail
          rm -rf ${{ runner.temp }}/elections_feeds
          python3 actions/scrape-elections/main.py \
            --output ${{ runner.temp }}/elections.json \
            --rss ${{ runner.temp }}/elections.xml \
            --rss-feeds-dir ${{ runner.temp }}/elections_feeds \
            --legislation docs/src/dashboard/data.json \
            --hearings docs/src/dashboard/hearings.json \
            || echo "::warning::elections scrape reported errors"
          if [ -s ${{ runner.temp }}/elections.json ] && \
             [ "$(python3 -c 'import json;d=json.load(open("${{ runner.temp }}/elections.json"));print(sum(len(r["candidates"]) for r in d["races"]) + len(d.get("springfield", [])))' 2>/dev/null || echo 0)" -gt 0 ]; then
            mv ${{ runner.temp }}/elections.json docs/src/dashboard/elections.json
            [ -s ${{ runner.temp }}/elections.xml ] && mv ${{ runner.temp }}/elections.xml docs/src/dashboard/elections.xml
            # Replace the whole granular-feed directory so feeds for races that
            # dropped out don't linger as stale files.
            rm -rf docs/src/dashboard/elections
            [ -d ${{ runner.temp }}/elections_feeds ] && mv ${{ runner.temp }}/elections_feeds docs/src/dashboard/elections
            echo "elections.json + elections.xml + granular feeds refreshed"
          else
            echo "::warning::no candidates or Springfield bills produced; keeping committed sample elections.json + feeds"
          fi
          ls -lh docs/src/dashboard/elections.json docs/src/dashboard/elections.xml
          ls -1 docs/src/dashboard/elections/ 2>/dev/null | head -5 || true

      # 2026 Illinois general-election NOMINEES (statewide, U.S. Senate/House, and
      # the General Assembly). ISBE has no bulk download, so we read the certified
      # nominees off Wikipedia's per-office election pages (which themselves cite
      # the ISBE candidate list); each attached nominee records the page as its
      # source. Runs before money (so committees can match) and before the feeds
      # are written. Fully fail-soft: an unreachable/edited page contributes nothing.
      - name: Populate 2026 general-election nominees (Wikipedia)
        if: steps.gate.outputs.refresh == 'true'
        run: |
          set -uo pipefail
          python3 actions/scrape-elections/main.py \
            --enrich-candidates-wiki docs/src/dashboard/elections.json \
            || echo "::warning::Wikipedia nominee enrichment reported errors"

      # Current incumbents for races with no confirmed candidates yet: the sitting
      # alderperson of each of Chicago's 50 wards, from the City Data Portal "Ward
      # Offices" dataset (the same portal the maps action uses). Fully fail-soft: a
      # portal outage attaches nothing. (IL General Assembly / federal incumbents are
      # resolved on the frontend from the people roster; CPS / police district
      # councils have no published roster.)
      - name: Populate current incumbents (Chicago aldermen)
        if: steps.gate.outputs.refresh == 'true'
        run: |
          set -uo pipefail
          python3 actions/scrape-elections/main.py \
            --enrich-incumbents docs/src/dashboard/elections.json \
            || echo "::warning::incumbent enrichment reported errors"

      # Party for the nonpartisan Chicago races, from Wikidata's structured P102
      # ("member of political party") — the aldermen via the office-enumerated
      # roster (no name-match risk), citywide candidates via a strict per-name gate.
      # Never guesses; fully fail-soft (Wikidata down / no confident match → nothing,
      # so a bad day never writes a wrong party).
      - name: Fill party from Wikidata (nonpartisan Chicago races)
        if: steps.gate.outputs.refresh == 'true'
        run: |
          set -uo pipefail
          python3 actions/scrape-elections/main.py \
            --enrich-party docs/src/dashboard/elections.json \
            || echo "::warning::Wikidata party enrichment reported errors"

      # Official candidates from the Chicago Board of Elections' Candidate List PDF.
      # The BOE publishes the authoritative roster only as a PDF, so we extract it
      # with `pdftotext` (poppler-utils, a system tool like the DuckDB dependency)
      # and merge the Board-of-Education races on the ballot (president + 20
      # subdistricts). Runs before money (so committees can match) and before the
      # feeds are written. Fully fail-soft: no poppler / no PDF leaves candidates as
      # they were. As more offices appear on official lists, this populates them too.
      - name: Populate official candidates from the Chicago BOE candidate list (PDF)
        if: steps.gate.outputs.refresh == 'true'
        # Normally takes seconds. Cap it so a hung download (apt mirror / BOE site)
        # can't stall the whole deploy (it once hung for hours, blocking every queued
        # deploy behind it); on a timeout the step is skipped and the deploy goes on
        # with the candidates already in elections.json.
        timeout-minutes: 20
        continue-on-error: true
        run: |
          set -uo pipefail
          sudo apt-get update && sudo apt-get install -y poppler-utils \
            || echo "::warning::poppler-utils install failed; skipping BOE candidate PDF"
          if command -v pdftotext >/dev/null 2>&1; then
            python3 actions/scrape-elections/main.py \
              --enrich-candidates-boe docs/src/dashboard/elections.json \
              || echo "::warning::BOE candidate enrichment reported errors"
          fi
          python3 -c 'import json;d=json.load(open("docs/src/dashboard/elections.json"));n=sum(len(r.get("candidates") or []) for r in d["races"]);print(f"official candidates now: {n}")'

      # Potential candidates (unofficial): before filing opens, surface names the
      # press reports as running/exploring for each race, from a Google News
      # search — each tied to its article. Written straight into elections.json
      # (a rumor/coverage signal, kept separate from the official candidate list;
      # in the RSS feeds they appear only in the per-race feeds, prefixed
      # [UNOFFICIAL]). Runs before the RSS feeds are written (the base build step's
      # --rss / --rss-feeds-dir happen after this), independent of whether official
      # candidates exist yet, and fully fail-soft: sources down leaves the lists empty.
      - name: Enrich races with news-sourced potential candidates
        if: steps.gate.outputs.refresh == 'true'
        run: |
          set -uo pipefail
          python3 actions/scrape-elections/main.py \
            --enrich-potential docs/src/dashboard/elections.json \
            || echo "::warning::potential-candidate enrichment reported errors"
          python3 -c 'import json;d=json.load(open("docs/src/dashboard/elections.json"));n=sum(len(r.get("potential_candidates") or []) for r in d["races"]);print(f"potential candidates surfaced: {n}")'

      # Campaign money: Illinois SBE for state/local races (each candidate's active
      # committees' latest D2 filing, via the SBE ID crosswalk) and the FEC's bulk
      # candidate summary for U.S. House/Senate races. Gated on candidates actually
      # being present — the SBE bulk files are large (~70MB), so we only download +
      # enrich when there's something to enrich. Fully fail-soft: a download error
      # just leaves money off. elections.il.gov sometimes answers 403 to GitHub's
      # runners for a while, so each file is retried, and a file that still fails
      # falls back to the last complete set of SBE files (cached below), so one
      # blocked run doesn't wipe every Illinois candidate's money off the page.
      - name: Restore last good SBE money files
        if: steps.gate.outputs.refresh == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sbe-last
          key: sbe-money-${{ github.run_id }}
          restore-keys: sbe-money-
      - name: Enrich candidates with campaign money (SBE + FEC)
        id: money
        if: steps.gate.outputs.refresh == 'true'
        run: |
          set -uo pipefail
          CANDS="$(python3 -c 'import json;d=json.load(open("docs/src/dashboard/elections.json"));print(sum(len(r["candidates"]) for r in d["races"]))' 2>/dev/null || echo 0)"
          if [ "$CANDS" -gt 0 ]; then
            mkdir -p ${{ runner.temp }}/sbe
            base="https://www.elections.il.gov/campaigndisclosuredatafiles"
            ok=1; fresh=1
            for f in Candidates.txt CmteCandidateLinks.txt Committees.txt D2Totals.txt; do
              got=0
              for wait in 0 20 60; do
                sleep "$wait"
                # curl's --retry skips a 403, so retry here; write to .part so a
                # failed download never leaves a half file behind.
                if curl -fsSL --retry 3 -A "chihacknight-civic-data/1.0" \
                     -o "${{ runner.temp }}/sbe/$f.part" "$base/$f"; then
                  mv "${{ runner.temp }}/sbe/$f.part" "${{ runner.temp }}/sbe/$f"; got=1; break
                fi
              done
              rm -f "${{ runner.temp }}/sbe/$f.part"
              if [ "$got" = "0" ]; then
                fresh=0
                if [ -s "${{ runner.temp }}/sbe-last/$f" ]; then
                  echo "::warning::could not download $f; using the last good copy"
                  cp "${{ runner.temp }}/sbe-last/$f" "${{ runner.temp }}/sbe/$f"
                else
                  echo "::warning::could not download $f"; ok=0
                fi
              fi
            done
            # Only a complete, fresh set becomes the next run's fallback.
            if [ "$fresh" = "1" ]; then
              mkdir -p ${{ runner.temp }}/sbe-last
              for f in Candidates.txt CmteCandidateLinks.txt Committees.txt D2Totals.txt; do
                cp "${{ runner.temp }}/sbe/$f" "${{ runner.temp }}/sbe-last/$f"
              done
              echo "fresh=true" >> "$GITHUB_OUTPUT"
            fi
            # U.S. House/Senate money: the FEC's keyless "All candidates" summary for the
            # 2026 cycle (~200 KB zipped). Optional — without it federal races get none.
            curl -fsSL --retry 3 -o ${{ runner.temp }}/weball.zip https://www.fec.gov/files/bulk-downloads/2026/weball26.zip \
              && unzip -o -q ${{ runner.temp }}/weball.zip -d ${{ runner.temp }}/sbe \
              || echo "::warning::could not download the FEC candidate summary"
            if [ "$ok" = "1" ] || ls ${{ runner.temp }}/sbe/weball*.txt >/dev/null 2>&1; then
              python3 actions/scrape-elections/main.py \
                --enrich-money docs/src/dashboard/elections.json --money-dir ${{ runner.temp }}/sbe \
                || echo "::warning::money enrichment reported errors"
            fi
          else
            echo "no candidates present; skipping SBE money download/enrichment"
          fi
      - name: Save SBE money files for the next run
        if: steps.money.outputs.fresh == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/sbe-last
          key: sbe-money-${{ github.run_id }}

      # Election results (post-Election-Night): when the ELECTION_RESULTS_URL repo
      # variable/secret points at the authority's results export (Chicago BOE or
      # Cook County Clerk CSV/TSV), download it and attach per-race vote tallies.
      # Inert until that is set — there are no results before an election — and
      # fully fail-soft.
      - name: Attach election results
        if: steps.gate.outputs.refresh == 'true'
        env:
          ELECTION_RESULTS_URL: ${{ vars.ELECTION_RESULTS_URL || secrets.ELECTION_RESULTS_URL }}
          ELECTION_RESULTS_PAGE: ${{ vars.ELECTION_RESULTS_PAGE }}
        run: |
          set -uo pipefail
          if [ -n "${ELECTION_RESULTS_URL:-}" ]; then
            curl -fsSL --retry 3 -o ${{ runner.temp }}/results.csv "$ELECTION_RESULTS_URL" \
              && python3 actions/scrape-elections/main.py \
                   --enrich-results docs/src/dashboard/elections.json \
                   --results-file ${{ runner.temp }}/results.csv \
                   --results-url "${ELECTION_RESULTS_PAGE:-$ELECTION_RESULTS_URL}" \
              || echo "::warning::results enrichment failed; leaving results off"
          else
            echo "ELECTION_RESULTS_URL not set; skipping results (none before Election Night)"
          fi

      # Rebuild the elections RSS feeds LAST, from the fully-enriched elections.json.
      # The base build wrote feeds before potential candidates + money were attached;
      # regenerate so the per-race feeds carry the [UNOFFICIAL] potential-candidate
      # items and the per-candidate money figures. Fail-soft.
      - name: Rebuild elections RSS feeds from enriched data
        if: steps.gate.outputs.refresh == 'true'
        run: |
          set -uo pipefail
          python3 actions/scrape-elections/main.py \
            --rss-from docs/src/dashboard/elections.json \
            --rss docs/src/dashboard/elections.xml \
            --rss-feeds-dir docs/src/dashboard/elections \
            || echo "::warning::elections RSS rebuild reported errors"

      # Snapshot the freshly-built data (bills + gitignored artifacts) so the next
      # frontend-only push / PR can reuse it instead of re-running the pipeline.
      - name: Save built data for fast frontend-only deploys
        if: steps.gate.outputs.refresh == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            docs/src/dashboard/data.json
            docs/src/dashboard/il_summaries.json
            docs/src/dashboard/summaries
            docs/src/dashboard/legislator_images.json
            docs/src/dashboard/assets/legislators
            docs/src/dashboard/people.json
            docs/src/dashboard/maps.json
            docs/src/dashboard/hearings.json
            docs/src/dashboard/hearings.xml
            docs/src/dashboard/hearings
            docs/src/dashboard/elections.json
            docs/src/dashboard/elections.xml
            docs/src/dashboard/elections
          key: govbot-built-data-${{ github.run_id }}

      # Split the all-bills data.json into the small files each page reads (bills/index.json,
      # bills/<state>.json, bills/il_recent.json, bills/search.json) so no page downloads all
      # ~180k bills. Runs on every deploy, fast path included (data.json is restored there), and
      # takes seconds — so the slices always match the data.json being published. It also writes
      # the public downloads behind Explore Legislation's "Download the data" panel (per-state CSVs,
      # all bills as a zipped CSV, README.txt, manifest.json) into dashboard/downloads/ (gitignored).
      - name: Build per-page bill slices and downloads
        run: python3 scripts/build_site_slices.py --data docs/src/dashboard/data.json --out-dir docs/src/dashboard/bills --downloads-dir docs/src/dashboard/downloads

      - name: Build docs
        run: mdbook build docs

      # The plain files crawlers and AI assistants look for at the site's root: sitemap.xml (every
      # listed page; redirect pages are left out) plus llms.txt and catalog.json, which live at the
      # repo root and are copied here so they are published at chihacknight.github.io/govbot/.
      - name: Publish sitemap, llms.txt and catalog.json
        run: python3 scripts/build_sitemap.py --book docs/book

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
