[book]
language = "en"
src = "src"
title = "govbot"

[rust]
edition = "2021"

[output.html]
default-theme = "rust"
preferred-dark-theme = "coal"
additional-css = ["theme/mdbook-civic.css"]
additional-js = ["theme/landing.js"]

# The doc pages carry the site's own header and footer: no print-the-book,
# GitHub or suggest-an-edit icons in mdbook's bar (GitHub is in the header).
[output.html.print]
enable = false

[output.html.search]
limit-results = 20
use-boolean-and = true
boost-title = 2
boost-hierarchy = 2
boost-paragraph = 1
expand = true
heading-split-level = 2
